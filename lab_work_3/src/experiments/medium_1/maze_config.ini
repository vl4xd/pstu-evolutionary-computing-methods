#--- Hyper-parameters for the Single-Pole balancing experiment ---#

[NEAT]
# Критерий оценки приспособленности: 'max' – максимизировать, 'min' – минимизировать.
fitness_criterion     = max
# Порог приспособленности, при достижении которого эксперимент считается успешным и завершается.
fitness_threshold     = 1.0
# Размер популяции.
pop_size              = 250
# Сбрасывать ли популяцию при вымирании всех видов (False – нет, продолжать эволюцию).
reset_on_extinction   = False
# Завершать ли эволюцию, если приспособленность не улучшается (False – не завершать, даже если прогресса нет).
no_fitness_termination = False

[DefaultGenome]
# node activation options
# Функция активации по умолчанию для новых узлов.
activation_default      = sigmoid
# Вероятность мутации функции активации узла.
activation_mutate_rate  = 0.0
# Список доступных функций активации (через пробел).
activation_options      = sigmoid

# node aggregation options
# Функция агрегации по умолчанию (sum – сумма входов).
aggregation_default     = sum
# Вероятность мутации функции агрегации.
aggregation_mutate_rate = 0.0
# Доступные функции агрегации.
aggregation_options     = sum

# node bias options
# Среднее значение начального смещения.
bias_init_mean          = 0.0
# Стандартное отклонение начального смещения.
bias_init_stdev         = 1.0
# Максимально допустимое значение смещения.
bias_max_value          = 30.0
# Минимально допустимое значение смещения.
bias_min_value          = -30.0
# Сила мутации смещения (при мутации добавляется случайное число из нормального распределения с дисперсией bias_mutate_power).
bias_mutate_power       = 0.5
# Вероятность мутации смещения узла.
bias_mutate_rate        = 0.7
# Вероятность замены смещения новым случайным значением (вместо мутации добавлением шума)
bias_replace_rate       = 0.1

# genome compatibility options
# Коэффициент влияния непересекающихся генов при расчёте дистанции совместимости.
compatibility_disjoint_coefficient = 1.1
# Коэффициент влияния разницы весов одинаковых связей при расчёте дистанции.
compatibility_weight_coefficient   = 0.5

# connection add/remove rates
# Вероятность добавления новой связи при мутации.
conn_add_prob           = 0.5
# Вероятность удаления существующей связи при мутации.
conn_delete_prob        = 0.5

# connection enable options
# Состояние новой связи по умолчанию (True – включена, False – выключена).
enabled_default         = True
# Вероятность мутации, переключающей состояние связи (включена <-> выключена).
enabled_mutate_rate     = 0.01

# Разрешить ли рекуррентные связи (False – сеть прямого распространения, True – разрешены циклы).
feed_forward            = False
# Метод инициализации связей: 'partial_direct 0.5' – часть связей от входов к выходам создаётся напрямую с вероятностью 0.5.
initial_connection      = partial_direct 0.5

# node add/remove rates
# Вероятность добавления нового узла (разрыв существующей связи) при мутации.
node_add_prob           = 0.1
# Вероятность удаления существующего скрытого узла при мутации.
node_delete_prob        = 0.1

# network parameters
# Начальное количество скрытых узлов.
num_hidden              = 1
# Количество входных узлов (сенсоров). Соответствует числу входных параметров задачи.
num_inputs              = 10
# Количество выходных узлов (эффекторов). Соответствует числу управляющих воздействий.
num_outputs             = 2

# node response options
# Среднее начального значения отклика.
response_init_mean      = 1.0
# Стандартное отклонение начального отклика.
response_init_stdev     = 0.0
# Максимальное значение отклика.
response_max_value      = 30.0
# Минимальное значение отклика.
response_min_value      = -30.0
# Сила мутации отклика.
response_mutate_power   = 0.0
# Вероятность мутации отклика.
response_mutate_rate    = 0.0
# Вероятность полной замены отклика новым случайным значение
response_replace_rate   = 0.0

# connection weight options
# Среднее значение начального веса.
weight_init_mean        = 0.0
# Стандартное отклонение начального веса.
weight_init_stdev       = 1.0
# Максимально допустимый вес связи.
weight_max_value        = 30
# Минимально допустимый вес связи.
weight_min_value        = -30
# Сила мутации веса (амплитуда нормального шума).
weight_mutate_power     = 0.5
# Вероятность мутации веса существующей связи.
weight_mutate_rate      = 0.8
# Вероятность полной замены веса новым случайным значением.
weight_replace_rate     = 0.1

[DefaultSpeciesSet]
# Порог совместимости для отнесения генома к существующему виду.
compatibility_threshold = 3.0

[DefaultStagnation]
# Функция агрегации приспособленности внутри вида для определения застоя: 'max' – по лучшему представителю, 'mean' – по среднему.
species_fitness_func = max
# Максимальное число поколений без улучшения, после которого вид считается вымирающим.
max_stagnation       = 20
# Количество видов, которые гарантированно получают элитных представителей в следующее поколение.
species_elitism      = 1

[DefaultReproduction]
# Количество лучших геномов, переходящих в следующее поколение без изменений (элитизм).
elitism            = 2
# Доля популяции, которая допускается к размножению (остальные отбрасываются).
survival_threshold = 0.1
# Минимальное количество особей в виде (если меньше, вид может быть расформирован).
min_species_size   = 2